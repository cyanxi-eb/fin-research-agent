# Fin Research Agent — Nginx 反代配置
# 处理：SPA fallback + SSE /api/ask/stream 反代缓冲关闭 + /metrics Prometheus 抓取
server {
    listen 80;
    server_name _;

    # 前端静态资源（React SPA，构建产物在 /app/web/ 由 uvicorn 托管，
    # Nginx 直接反代到 app，SPA fallback 由 FastAPI 处理）
    location / {
        proxy_pass http://app:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SSE 流：/api/ask/stream —— **必须关缓冲**，否则客户端收不到流式事件
    # proxy_read_timeout 要设长（SSE 可以连好几分钟），但 proxy_send_timeout 不能设太短
    location /api/ask/stream {
        proxy_pass http://app:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # SSE 核心：关缓冲 + 长连接
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;     # 5 分钟 SSE 容忍
        proxy_send_timeout 300s;
        chunked_transfer_encoding on;
        # 防止 Nginx 把 Content-Type 改成 chunked
        add_header X-Accel-Buffering no always;
    }

    # 普通 API 反代（带 /api/v1 rewrite — 后端 middleware 处理，Nginx 不用改路径）
    location /api/ {
        proxy_pass http://app:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 加 CORS 头（开发/演示用；生产应在 FastAPI CORS middleware 里精确配置）
        add_header Access-Control-Allow-Origin $http_origin always;
        add_header Access-Control-Allow-Credentials true always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Request-Id" always;
    }

    # Prometheus /metrics —— 反代但可以限速（不让外界随便打）
    location /api/metrics {
        proxy_pass http://app:8000;
        # 仅内网网段允许抓取（Prometheus 在同一 compose 网络里）
        # allow 10.0.0.0/8;    # uncomment to restrict
        # deny all;
    }

    # Grafana 反代（host 级挂载）
    location /grafana/ {
        proxy_pass http://grafana:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Prometheus UI 反代（host 级挂载）
    location /prometheus/ {
        proxy_pass http://prometheus:9090/;
        proxy_set_header Host $host;
    }
}
