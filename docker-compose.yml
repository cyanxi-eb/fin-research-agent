# Phase 4 部署工程化 — Docker Compose 完整栈
# 用法：
#   默认（app + MySQL + Nginx）：
#     docker compose up -d
#   带监控（加 Prometheus + Grafana）：
#     docker compose --profile monitoring up -d
#   带 Qdrant 向量数据库：
#     FA_VECTOR_BACKEND=qdrant docker compose --profile qdrant up -d
#   全栈（app + MySQL + Nginx + Prometheus + Grafana + Qdrant）：
#     FA_VECTOR_BACKEND=qdrant docker compose --profile monitoring --profile qdrant up -d

services:
  # ============ 后端应用 ============
  app:
    build:
      context: .
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://mirrors.aliyun.com/pypi/simple/}
    container_name: fin-research-agent
    ports:
      # 直接暴露 app（便于调试；Nginx 也反代它）
      - "${APP_PORT:-8000}:8000"
    environment:
      # ---- 已有环境变量（保持原样）----
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      QWEN_API_KEY: ${QWEN_API_KEY:-}
      RETRIEVE_MODE: ${RETRIEVE_MODE:-hybrid}
      FA_AUTH_ENABLED: ${FA_AUTH_ENABLED:-1}
      FA_JWT_SECRET: ${FA_JWT_SECRET:-}
      SEED_ADMIN_USER: ${SEED_ADMIN_USER:-admin}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
      FA_WEB_SEARCH_ENABLED: ${FA_WEB_SEARCH_ENABLED:-1}
      FA_WEB_SEARCH_BACKEND: ${FA_WEB_SEARCH_BACKEND:-bing}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      FA_DB_BACKEND: ${FA_DB_BACKEND:-mysql}
      MYSQL_HOST: ${MYSQL_HOST:-web-db}
      MYSQL_PORT: "3306"
      MYSQL_USER: ${MYSQL_USER:-agent}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-finagent}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-fin_research}
      # ---- Phase 2 新增 ----
      FA_VECTOR_BACKEND: ${FA_VECTOR_BACKEND:-numpy}
      FA_QDRANT_URL: ${FA_QDRANT_URL:-http://qdrant:6333}
      FA_QDRANT_COLLECTION: ${FA_QDRANT_COLLECTION:-fin_research_vectors}
      # ---- Phase 3 新增 ----
      FA_RATE_LIMIT_ENABLED: ${FA_RATE_LIMIT_ENABLED:-1}
      FA_STRUCTURED_LOGGING: ${FA_STRUCTURED_LOGGING:-1}
      FA_RESPONSE_ENVELOPE: ${FA_RESPONSE_ENVELOPE:-1}
    volumes:
      - fin-research-data:/app/data
    depends_on:
      web-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    mem_limit: 1200m
    restart: unless-stopped
    networks:
      - default
      - monitoring

  # ============ MySQL 8 ============
  web-db:
    image: mysql:8.0
    container_name: fin-research-agent-web-db
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-finroot}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-fin_research}
      MYSQL_USER: ${MYSQL_USER:-agent}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-finagent}
    command:
      - mysqld
      - --default-time-zone=+08:00
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --innodb-buffer-pool-size=128M
      - --performance-schema=OFF
    volumes:
      - fin-research-mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 120s
    mem_limit: 900m
    restart: unless-stopped

  # ============ Nginx 反代 ============
  # 职责：SPA fallback + SSE 缓冲关闭 + Prometheus/Grafana 反代挂载
  nginx:
    image: nginx:alpine
    container_name: fin-research-agent-nginx
    ports:
      - "${NGINX_PORT:-80}:80"
    volumes:
      - ./deploy/nginx/fin-research.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1/api/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped
    networks:
      - default
      - monitoring

  # ============ Prometheus（profile: monitoring）============
  prometheus:
    image: prom/prometheus:latest
    container_name: fin-research-agent-prometheus
    profiles: ["monitoring"]
    ports:
      - "9090:9090"
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=15d'
    restart: unless-stopped
    networks:
      - default
      - monitoring

  # ============ Grafana（profile: monitoring）============
  grafana:
    image: grafana/grafana:latest
    container_name: fin-research-agent-grafana
    profiles: ["monitoring"]
    ports:
      - "3000:3000"
    environment:
      # 首次启动 admin 密码；之后持久化到 grafana-data 卷
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-finresearch}
      # 预置 Prometheus datasource（host=prometheus:9090）
      GF_DATASOURCES_PROMETHEUS_URL: http://prometheus:9090
      GF_DATASOURCES_PROMETHEUS_ACCESS: proxy
    volumes:
      - grafana-data:/var/lib/grafana
      - ./deploy/grafana/dashboard.json:/etc/grafana/provisioning/dashboards/fin-research.json:ro
    depends_on:
      - prometheus
    restart: unless-stopped
    networks:
      - default
      - monitoring

  # ============ Qdrant（profile: qdrant）============
  qdrant:
    image: qdrant/qdrant:latest
    container_name: fin-research-agent-qdrant
    profiles: ["qdrant"]
    ports:
      - "6333:6333"
    volumes:
      - qdrant-data:/qdrant/storage
    environment:
      QDRANT__SERVICE__GRPC_PORT: "6334"
    # Qdrant 官方镜像无 wget/curl，不设 healthcheck（启动 <1s）
    restart: unless-stopped
    networks:
      - default
      - monitoring

volumes:
  fin-research-data:
  fin-research-mysql:
  prometheus-data:
  grafana-data:
  qdrant-data:

networks:
  monitoring:
    driver: bridge
